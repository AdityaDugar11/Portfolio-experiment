<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Junagarh geometry preview</title>
    <style>
      :root { color-scheme: dark; font: 14px system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #25201a; color: #f4e7d7; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; margin: 0; background: #25201a; }
      [hidden] { display: none !important; }
      #tools { position: absolute; inset: auto 16px 16px; width: max-content; max-width: calc(100% - 32px);
        display: grid; gap: 7px; padding: 9px; background: #231d18f2; color: #f4e7d7; border: 1px solid #695647; border-radius: 8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 5px; }
      button { color: inherit; background: #3a3028; border: 1px solid #706055; border-radius: 4px; padding: 7px 10px; font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { color: #211913; background: #efcc9b; border-color: #efcc9b; }
      :focus-visible { outline: 2px solid #f7daba; outline-offset: 2px; }
      label { display: flex; align-items: center; gap: 10px; min-height: 29px; padding: 1px 4px; }
      input { flex: 1; min-width: 0; accent-color: #efcc9b; }
      #hint { margin: 0; padding: 0 3px 2px; color: #d5c0ae; font-size: 12px; }
      @media (max-width: 550px) {
        #tools { inset: auto 8px max(8px, env(safe-area-inset-bottom)); max-width: calc(100% - 16px); }
        button { padding: 8px; }
      }
    </style>
  </head>
  <body>
    <canvas aria-label="Live three-dimensional study of the Suraj Pol gateway"></canvas>
    <p id="status" role="status">Loading geometry and sandstone textures…</p>
    <section id="tools" aria-label="Preview controls" hidden>
      <div class="controls" aria-label="Camera views">
        <button type="button" data-view="elevated" aria-pressed="true">Elevated</button>
        <button type="button" data-view="ground" aria-pressed="false">Ground</button>
        <button type="button" data-view="detail" aria-pressed="false">Stone detail</button>
        <button type="button" data-view="passage" aria-pressed="false">Through gate</button>
        <button type="button" id="doors" aria-pressed="false">Open doors</button>
      </div>
      <label id="passage" hidden>Passage position <input type="range" min="0" max="100" step="1" value="0"></label>
      <p id="hint">Drag to orbit · Scroll or pinch to zoom · Right-drag or two-finger drag to pan</p>
    </section>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
